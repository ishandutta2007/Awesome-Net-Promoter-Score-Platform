<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="promoterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="passiveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="detractorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-weight: 800; font-size: 42px; fill: url(#accentGrad); letter-spacing: -0.5px; }
    .subtitle { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-weight: 500; font-size: 19px; fill: #94a3b8; }
    .badge-text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-weight: 700; font-size: 14px; fill: #ffffff; }
    .stat-val { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-weight: 800; font-size: 24px; fill: #f8fafc; }
    .stat-lbl { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-weight: 600; font-size: 12px; fill: #64748b; letter-spacing: 0.5px; }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.05); }
    }
    @keyframes floatBar {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    .glowing-orb { animation: pulse 4s ease-in-out infinite; transform-origin: center; }
    .bar-anim { animation: floatBar 3s ease-in-out infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="380" rx="16" fill="url(#bgGrad)" />
  <rect width="1196" height="376" x="2" y="2" rx="15" fill="none" stroke="#1e293b" stroke-width="2" />

  <!-- Dynamic Glowing Mesh Grid Background -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="380" />
    <line x1="300" y1="0" x2="300" y2="380" />
    <line x1="450" y1="0" x2="450" y2="380" />
    <line x1="600" y1="0" x2="600" y2="380" />
    <line x1="750" y1="0" x2="750" y2="380" />
    <line x1="900" y1="0" x2="900" y2="380" />
    <line x1="1050" y1="0" x2="1050" y2="380" />
  </g>

  <!-- Dynamic Orbs -->
  <circle cx="1050" cy="90" r="130" fill="#38bdf8" class="glowing-orb" filter="url(#glow)" />
  <circle cx="150" cy="300" r="100" fill="#818cf8" class="glowing-orb" filter="url(#glow)" />

  <!-- Left Icon: NPS Gauge / Analytics -->
  <g transform="translate(60, 48)">
    <rect width="64" height="64" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <path d="M18 42 A 16 16 0 0 1 46 42" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
    <circle cx="32" cy="42" r="3.5" fill="#c084fc" />
    <line x1="32" y1="42" x2="42" y2="26" stroke="#c084fc" stroke-width="3" stroke-linecap="round" />
    <circle cx="21" cy="33" r="2" fill="#ef4444" />
    <circle cx="32" cy="23" r="2" fill="#f59e0b" />
    <circle cx="43" cy="33" r="2" fill="#10b981" />
  </g>

  <!-- Title & Subtitle -->
  <text x="140" y="88" class="title">Awesome Net Promoter Score (NPS) Platforms</text>
  <text x="140" y="128" class="subtitle">Curated SaaS &amp; Open-Source Ecosystem for Customer Feedback, CX &amp; Survey Intelligence</text>

  <!-- Interactive Metric Pills (NPS 0-10 Concept) -->
  <g transform="translate(60, 160)" class="bar-anim">
    <!-- Detractors Group (0-6) -->
    <rect x="0" y="0" width="340" height="74" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <rect x="12" y="12" width="50" height="50" rx="10" fill="url(#detractorGrad)" />
    <text x="37" y="43" class="badge-text" text-anchor="middle" font-size="20">0-6</text>
    <text x="76" y="36" class="stat-val" fill="#f87171">Detractors</text>
    <text x="76" y="54" class="stat-lbl">ACTION &amp; CHURN PREVENTION</text>

    <!-- Passives Group (7-8) -->
    <rect x="360" y="0" width="340" height="74" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <rect x="372" y="12" width="50" height="50" rx="10" fill="url(#passiveGrad)" />
    <text x="397" y="43" class="badge-text" text-anchor="middle" font-size="20">7-8</text>
    <text x="436" y="36" class="stat-val" fill="#fbbf24">Passives</text>
    <text x="436" y="54" class="stat-lbl">RETENTION &amp; OPTIMIZATION</text>

    <!-- Promoters Group (9-10) -->
    <rect x="720" y="0" width="360" height="74" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <rect x="732" y="12" width="50" height="50" rx="10" fill="url(#promoterGrad)" />
    <text x="757" y="43" class="badge-text" text-anchor="middle" font-size="18">9-10</text>
    <text x="796" y="36" class="stat-val" fill="#34d399">Promoters</text>
    <text x="796" y="54" class="stat-lbl">ADVOCACY, REVIEWS &amp; VIRALITY</text>
  </g>

  <!-- Bottom Badges / Tags -->
  <g transform="translate(60, 270)">
    <!-- NPS Formula Badge -->
    <rect x="0" y="0" width="320" height="42" rx="8" fill="#1e1e38" stroke="#4f46e5" stroke-width="1" />
    <text x="160" y="26" class="badge-text" text-anchor="middle" fill="#a5b4fc">📊 NPS = % Promoters − % Detractors</text>

    <!-- Enterprise SaaS Badge -->
    <rect x="335" y="0" width="220" height="42" rx="8" fill="#0f2b38" stroke="#0ea5e9" stroke-width="1" />
    <text x="445" y="26" class="badge-text" text-anchor="middle" fill="#7dd3fc">🏢 Top Enterprise SaaS</text>

    <!-- Open Source Badge -->
    <rect x="570" y="0" width="240" height="42" rx="8" fill="#06382b" stroke="#10b981" stroke-width="1" />
    <text x="690" y="26" class="badge-text" text-anchor="middle" fill="#6ee7b7">⚡ Self-Hosted &amp; Open Source</text>

    <!-- AI & Automation Badge -->
    <rect x="825" y="0" width="255" height="42" rx="8" fill="#2d1738" stroke="#a855f7" stroke-width="1" />
    <text x="952" y="26" class="badge-text" text-anchor="middle" fill="#d8b4fe">🤖 AI Feedback Intelligence</text>
  </g>
</svg>
